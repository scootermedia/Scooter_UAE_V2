<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taking you to Scooter Global | Scooter</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0F5C6D">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
<!-- Fallback if JavaScript is off -->
<meta http-equiv="refresh" content="3;url=https://scootermedia.co">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{display:flex;align-items:center;justify-content:center;background:#0F5C6D;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px}
  .logo{font-size:32px;font-weight:700;letter-spacing:-.03em}
  .globe{width:72px;height:72px;margin:40px auto 32px;display:block}
  .globe circle,.globe ellipse,.globe line{fill:none;stroke:#CFE5E9;stroke-width:1.5}
  .spin{transform-origin:36px 36px;animation:spin 2.4s linear infinite}
  .msg{font-size:18px;font-weight:500}
  .bar{width:220px;height:3px;margin:24px auto 0;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:#fff;animation:fill 2s ease-in-out forwards}
  .skip{display:inline-block;margin-top:28px;font-size:14px;color:#CFE5E9;text-decoration:underline;text-underline-offset:3px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fill{to{width:100%}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<main role="status" aria-live="polite">
  <div class="logo">scooter</div>
  <svg class="globe" viewBox="0 0 72 72" aria-hidden="true">
    <circle cx="36" cy="36" r="30"/>
    <line x1="6" y1="36" x2="66" y2="36"/>
    <g class="spin"><ellipse cx="36" cy="36" rx="13" ry="30"/></g>
  </svg>
  <p class="msg">Taking you to Scooter Global…</p>
  <div class="bar"><i></i></div>
  <a class="skip" href="https://scootermedia.co">Go now</a>
</main>
<script>setTimeout(function(){location.replace('https://scootermedia.co');},2000);</script>
</body>
</html>
